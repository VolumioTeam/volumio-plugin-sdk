name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm test

  build-example:
    uses: ./.github/workflows/build.yml
    with:
      path: examples/hello
      sdk-ref: ${{ github.event.pull_request.head.sha || github.sha }}
