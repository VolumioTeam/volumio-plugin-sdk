# Publishes @volumio/plugin-sdk to npm when a release is published. Trusted publishing: npm checks this
# workflow's GitHub OIDC token against the trusted publisher set on the package, so no npm token is stored,
# and npm attaches a provenance attestation to the version.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Node 24's npm (11.5.1 or later) is the first that publishes with trusted publishing.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: The tag is the package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm publish
