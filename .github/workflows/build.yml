# Reusable workflow: builds a Volumio plugin for each architecture it declares,
# runs the gates on the built package, and uploads zip + sha256 + provenance.
name: Build Volumio plugin

on:
  workflow_call:
    inputs:
      path:
        description: Plugin folder inside the repository
        type: string
        default: .
      sdk-ref:
        description: volumio-plugin-sdk ref whose CLI builds the plugin; defaults to this release
        type: string
        default: v0.2.0

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      arch: ${{ steps.arch.outputs.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: plugin
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: VolumioTeam/volumio-plugin-sdk
          ref: ${{ inputs.sdk-ref }}
          path: sdk
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci --prefix sdk --omit=dev --no-audit --no-fund
      - id: arch
        env:
          PLUGIN_PATH: plugin/${{ inputs.path }}
        run: |
          arch=$(node sdk/bin/volumio-plugin.js arch "$PLUGIN_PATH")
          echo "arch=$arch" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.arch) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: plugin
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: VolumioTeam/volumio-plugin-sdk
          ref: ${{ inputs.sdk-ref }}
          path: sdk
      - if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - env:
          PLUGIN_PATH: plugin/${{ inputs.path }}
          ARCH: ${{ matrix.arch }}
        run: sdk/scripts/build.sh "$PLUGIN_PATH" "$ARCH" dist-plugin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: plugin-${{ matrix.arch }}
          path: dist-plugin/
          if-no-files-found: error

  # G4 on the amd64 package: install it in a Volumio sandbox and compare with the manifest.
  sandbox:
    needs: [plan, build]
    if: contains(fromJSON(needs.plan.outputs.arch), 'amd64')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: VolumioTeam/volumio-plugin-sdk
          ref: ${{ inputs.sdk-ref }}
          path: sdk
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci --prefix sdk --omit=dev --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plugin-amd64
          path: dist-plugin
      - run: sdk/scripts/sandbox-image.sh
      - run: node sdk/bin/volumio-plugin.js sandbox dist-plugin/*-amd64.zip
